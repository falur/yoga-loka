        # Миграции Cycle живут в namespace `Migration\`, а не в `App\`, поэтому по имени класса их
        # не поймать — слой добирает их по каталогу модуля-владельца. Без этого миграция осталась
        # бы вне слоёв, и её зависимости никто бы не проверял.
        - type: directory
          value: 'app/src/Modules/Notifications/Infrastructure/Persistence/Cycle/Migration/'

    - name: NotificationsInfrastructureSpiral
      collectors:
        - type: classLike
          value: '^App\\Modules\\Notifications\\Infrastructure\\Spiral\\'

    - name: OutboxDomain
      collectors:
        - type: classLike
          value: '^App\\Modules\\Outbox\\Domain\\'

    - name: OutboxPublic
      collectors:
        - type: classLike
          value: '^App\\Modules\\Outbox\\Public\\'

    - name: OutboxApplication
      collectors:
        - type: classLike
          value: '^App\\Modules\\Outbox\\Application\\'

    - name: OutboxInfrastructure
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^App\\Modules\\Outbox\\Infrastructure\\'
          must_not:
            - type: classLike
              value: '^App\\Modules\\Outbox\\Infrastructure\\Spiral\\'
        # Миграции Cycle живут в namespace `Migration\`, а не в `App\`, поэтому по имени класса их
        # не поймать — слой добирает их по каталогу модуля-владельца. Без этого миграция осталась
