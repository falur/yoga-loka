    # --- Общие слои -----------------------------------------------------------------------------
    # `Shared` не импортирует бизнес-модули (docs/arch.md, «Границы слоёв → Shared»). Единственное
    # исключение — Kernel, собирающий bootloader-ы приложения; поэтому он вынесен из
    # `SharedInfrastructure` в собственный слой со своим правилом.

    - name: SharedDomain
      collectors:
        - type: classLike
          value: '^App\\Shared\\Domain\\'

    # Раздела `app/src/Shared/Application` сегодня нет — слой объявлен заранее, чтобы общая
    # нейтральная форма сценария, появившись, сразу попала под правила, а не осталась непокрытой.
    - name: SharedApplication
      collectors:
        - type: classLike
          value: '^App\\Shared\\Application\\'

    - name: SharedInfrastructure
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^App\\Shared\\Infrastructure\\'
          must_not:
            - type: classLike
              value: '^App\\Shared\\Infrastructure\\Spiral\\Kernel$'

    - name: Kernel
      collectors:
        - type: classLike
          value: '^App\\Shared\\Infrastructure\\Spiral\\Kernel$'

    # --- Слои внешних зависимостей --------------------------------------------------------------
    # Эти слои сами ни от чего не зависят (в `paths` их файлов нет) и в `ruleset` как источник не
    # появляются. Они нужны как цель: без них зависимость на Spiral или Cycle была бы «непокрытой»
    # и молча разрешённой.

    - name: SpiralFramework
      collectors:
        - type: classLike
          value: '^Spiral\\'

    - name: CycleOrm
      collectors:
        - type: classLike
          value: '^Cycle\\'

    # Нейтральные контракты собственных Composer-пакетов разделены на два слоя, потому что
    # docs/arch.md допускает их в разных слоях по-разному.
    #
    # Базовое переводимое исключение: `Shared/Domain/Exception/DomainTranslatableException`
    # наследует `GianTiaga\SpiralApiErrors\Exception\TranslatableException`, и это прямо названное
    # в docs/arch.md осознанное отступление — нейтральный контракт собственного пакета, не
    # фреймворк. Доменные исключения модулей наследуют тот же базовый класс через `Shared`, поэтому
    # слой доступен и из `{Module}Domain`: deptrac переносит зависимости предка на наследника, а
    # запрещать наследнику то, что разрешено его же базовому классу в `Shared`, бессмысленно.
    - name: OwnPackageExceptionContract
      collectors:
        - type: classLike
          value: '^GianTiaga\\SpiralApiErrors\\Exception\\'

    # Атрибуты и шины CQRS: контракт сценария, поэтому доступен `Application`, `Public` и
    # Infrastructure — и недоступен `Domain`, которому docs/arch.md оставляет только PHP,
    # собственный домен и `Shared/Domain`.
    - name: OwnPackageCqrsContract
      collectors:
        - type: classLike
          value: '^GianTiaga\\SpiralCqrs\\(Attribute\\|[A-Za-z]+Interface$)'

    # Остальное из собственных пакетов — bootloader-ы, middleware, интерсепторы, HTTP-ответы и
    # генератор OpenAPI: это runtime поверх Spiral, поэтому слой доступен только из
    # `{Module}InfrastructureSpiral`, `SharedInfrastructure` и `Kernel`. Не-Spiral части
    # Infrastructure (`Persistence/Cycle`, `Storage`, `Client`, `Ffmpeg`, `Imagick`, `Relay`,
    # `Serializer`) доступа к нему не имеют: runtime поверх Spiral — та же прямая зависимость от
    # фреймворка, которой docs/arch.md оставляет одно место — `Infrastructure/Spiral`.
    - name: OwnPackageRuntime
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^GianTiaga\\'
          must_not:
            - type: classLike
              value: '^GianTiaga\\(SpiralApiErrors\\Exception\\|SpiralCqrs\\(Attribute\\|[A-Za-z]+Interface$))'

  ruleset:
    # --- Модули ---------------------------------------------------------------------------------
    # Правила одинаковы для всех девяти модулей и читаются построчно как таблица
    # «Направления зависимостей» docs/arch.md.
    #
    # Domain         -> PHP, свой Domain, Shared/Domain и базовое переводимое исключение
    #                   собственного пакета, которое домен получает по наследству от
    #                   `Shared/Domain/Exception/DomainTranslatableException`. Ни Spiral, ни Cycle,
    #                   ни CQRS-контрактов — это и есть запрет фреймворка и ORM в домене.
    #                   Зависимость внутри своего слоя deptrac разрешает сам.
    # Public         -> свой Public, Public других модулей, Shared/Domain, нейтральные контракты
    #                   собственных пакетов.
    # Application    -> свой Domain, свой Public, Public других модулей, Shared/Domain,
    #                   Shared/Application, нейтральные контракты собственных пакетов.
    #                   Domain, Application и Infrastructure соседа недоступны — отсюда правило
    #                   «к соседу только через его Public», оно же закрывает ORM-связь через
    #                   границу модуля: цель связи Cycle импортируется обычным `use`.
    # Infrastructure -> свой Domain, Application, Public, свой Infrastructure/Spiral, Public
    #                   других модулей, Shared целиком, Cycle ORM и нейтральные контракты
    #                   собственных пакетов. Недоступны Spiral Framework и runtime собственных
    #                   пакетов поверх него: их место — Infrastructure/Spiral.
    # InfrastructureSpiral -> то же плюс Spiral Framework и runtime собственных пакетов.

    AccessDomain:
      - SharedDomain
      - OwnPackageExceptionContract

    AccessPublic:
      - AccessPublic
      - AuthPublic
      - MediaPublic
      - NotificationsPublic
      - OutboxPublic
      - PostsPublic
      - SystemPublic
      - TagsPublic
      - UserPublic
      - SharedDomain
      - OwnPackageExceptionContract
      - OwnPackageCqrsContract

    AccessApplication:
      - AccessDomain
      - AccessPublic
      - AuthPublic
      - MediaPublic
      - NotificationsPublic
      - OutboxPublic
      - PostsPublic
      - SystemPublic
      - TagsPublic
      - UserPublic
      - SharedDomain
      - SharedApplication
      - OwnPackageExceptionContract
      - OwnPackageCqrsContract

    AccessInfrastructure:
      - AccessDomain
      - AccessApplication
      - AccessInfrastructureSpiral
      - AccessPublic
      - AuthPublic
      - MediaPublic
      - NotificationsPublic
      - OutboxPublic
      - PostsPublic
      - SystemPublic
      - TagsPublic
      - UserPublic
      - SharedDomain
      - SharedApplication
      - SharedInfrastructure
      - CycleOrm
      - OwnPackageExceptionContract
      - OwnPackageCqrsContract

    AccessInfrastructureSpiral:
      - AccessDomain
      - AccessApplication
      - AccessInfrastructure
      - AccessPublic
      - AuthPublic
      - MediaPublic
      - NotificationsPublic
      - OutboxPublic
      - PostsPublic
      - SystemPublic
      - TagsPublic
      - UserPublic
      - SharedDomain
      - SharedApplication
      - SharedInfrastructure
      - SpiralFramework
      - CycleOrm
      - OwnPackageExceptionContract
      - OwnPackageCqrsContract
      - OwnPackageRuntime

    AuthDomain:
      - SharedDomain
      - OwnPackageExceptionContract

    AuthPublic:
      - AccessPublic
      - AuthPublic
      - MediaPublic
      - NotificationsPublic
      - OutboxPublic
      - PostsPublic
      - SystemPublic
      - TagsPublic
      - UserPublic
      - SharedDomain
      - OwnPackageExceptionContract
      - OwnPackageCqrsContract

    AuthApplication:
      - AuthDomain
      - AccessPublic
      - AuthPublic
      - MediaPublic
      - NotificationsPublic
      - OutboxPublic
      - PostsPublic
      - SystemPublic
      - TagsPublic
      - UserPublic
      - SharedDomain
      - SharedApplication
      - OwnPackageExceptionContract
      - OwnPackageCqrsContract

    AuthInfrastructure:
      - AuthDomain
      - AuthApplication
      - AuthInfrastructureSpiral
      - AccessPublic
      - AuthPublic
      - MediaPublic
      - NotificationsPublic
      - OutboxPublic
      - PostsPublic
      - SystemPublic
      - TagsPublic
      - UserPublic
      - SharedDomain
      - SharedApplication
      - SharedInfrastructure
      - CycleOrm
      - OwnPackageExceptionContract
      - OwnPackageCqrsContract

    AuthInfrastructureSpiral:
      - AuthDomain
      - AuthApplication
      - AuthInfrastructure
      - AccessPublic
      - AuthPublic
      - MediaPublic
      - NotificationsPublic
      - OutboxPublic
      - PostsPublic
      - SystemPublic
      - TagsPublic
      - UserPublic
      - SharedDomain
      - SharedApplication
      - SharedInfrastructure
      - SpiralFramework
      - CycleOrm
      - OwnPackageExceptionContract
      - OwnPackageCqrsContract
      - OwnPackageRuntime

    MediaDomain:
      - SharedDomain
      - OwnPackageExceptionContract

    MediaPublic:
      - AccessPublic
      - AuthPublic
