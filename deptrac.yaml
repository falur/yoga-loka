          must:
            - type: classLike
              value: '^App\\Modules\\Auth\\Infrastructure\\'
          must_not:
            - type: classLike
              value: '^App\\Modules\\Auth\\Infrastructure\\Spiral\\'
        # Миграции Cycle живут в namespace `Migration\`, а не в `App\`, поэтому по имени класса их
        # не поймать — слой добирает их по каталогу модуля-владельца. Без этого миграция осталась
        # бы вне слоёв, и её зависимости никто бы не проверял.
        - type: directory
