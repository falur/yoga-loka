    # Ни в одном из трёх списков ниже нет слоя бизнес-модуля: `Shared` не импортирует модули.

    SharedDomain:
      - OwnPackageExceptionContract

    SharedApplication:
      - SharedDomain
      - OwnPackageExceptionContract
      - OwnPackageCqrsContract

    SharedInfrastructure:
      - SharedDomain
      - SharedApplication
      - SpiralFramework
      - CycleOrm
      - OwnPackageExceptionContract
      - OwnPackageCqrsContract
      - OwnPackageRuntime

    # Kernel — единственное место, которому docs/arch.md разрешает знать состав модулей: он
    # собирает их bootloader-ы. Точнее слоя не получается: bootloader живёт в
    # `Infrastructure/Spiral` модуля, а слои обязаны быть взаимоисключающими — отдельный слой на
    # bootloader-ы пересёкся бы со слоем `{Module}InfrastructureSpiral`. Фактическое соблюдение
    # узкой формулировки проверяется тем, что Kernel импортирует ровно девять bootloader-ов.
    Kernel:
      - AccessInfrastructureSpiral
      - AuthInfrastructureSpiral
      - MediaInfrastructureSpiral
      - NotificationsInfrastructureSpiral
      - OutboxInfrastructureSpiral
      - PostsInfrastructureSpiral
      - SystemInfrastructureSpiral
      - TagsInfrastructureSpiral
      - UserInfrastructureSpiral
      - SharedInfrastructure
      - SpiralFramework
      - OwnPackageRuntime
