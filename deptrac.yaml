            - type: classLike
              value: '^App\\Modules\\Posts\\Infrastructure\\Spiral\\'
        # Миграции Cycle живут в namespace `Migration\`, а не в `App\`, поэтому по имени класса их
        # не поймать — слой добирает их по каталогу модуля-владельца. Без этого миграция осталась
