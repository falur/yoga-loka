# Проверка архитектурных границ (deptrac).
#
# Файл кодирует раздел «Направления зависимостей» docs/arch.md: слой описан один раз как набор
# классов, а разрешённые направления перечислены явно. Любое направление, которого нет в `ruleset`,
# считается нарушением и роняет проверку. Правила не смягчаются ни baseline, ни `skip_violations`:
# таких секций в файле нет и заводить их нельзя.
#
# Область анализа — `app/src` без `app/src/Modules/*/Tests/*`. Причины исключения тестов:
#   1. таблица «Направления зависимостей» docs/arch.md описывает слои Domain / Public / Application /
#      Infrastructure; `Tests` слоем не является и в таблице не участвует, поэтому исключение не
#      снимает ни одного объявленного здесь правила;
#   2. это ровно та область анализа, которую проект уже осознанно зафиксировал для PHPStan
#      (`phpstan.neon`, `excludePaths: app/src/Modules/*/Tests/*`), — расхождение областей двух
#      статических анализаторов создавало бы путаницу;
#   3. фикстуре интеграционного теста нужно готовить состояния, которых публичный контракт соседа не
#      выражает (например `Notifications/Tests/Support/PersistsMedia` собирает медиа через Domain и
#      Mapper модуля Media), — принуждение тестов ходить через `Public` сузило бы проверяемые
#      состояния и ослабило тесты.
# Ни одна строка продуктивного кода из-под проверки не выведена.
#
# Зависимости на классы, не попавшие ни в один слой (PHP, `Psr\`, `Illuminate\`, `Symfony\`,
# `Ramsey\` и прочий нейтральный вендор), deptrac считает непокрытыми и нарушением не объявляет:
# docs/arch.md их не ограничивает. Ограничиваемые технологии — Spiral Framework, Cycle ORM и
# собственные пакеты `GianTiaga\` — вынесены в отдельные слои ниже, поэтому запреты на них
# выражены явно, а не получаются случайно из-за отсутствия слоя.

deptrac:
  paths:
    - ./app/src
  exclude_files:
    # Тесты модулей — см. пункты 1-3 в шапке файла.
    - '#/Modules/[^/]+/Tests/#'

  # Кэш держим в runtime/, как это уже сделано для PHPStan (`tmpDir: runtime/phpstan`).
  cache_file: runtime/deptrac.cache

  analyser:
    # `use` добавлен к типам по умолчанию, чтобы нарушением считался сам импорт класса из чужого
    # слоя, а не только его использование в коде: забытый `use` — такое же нарушение границы.
    types:
      - class
      - function
      - use

  layers:
    # --- Слои модулей ---------------------------------------------------------------------------
    # На каждый из девяти модулей — пять слоёв. Infrastructure намеренно разделена на две части:
    # docs/arch.md («Границы слоёв → Infrastructure») требует, чтобы все прямые зависимости модуля
    # от Spiral лежали в `Infrastructure/Spiral`. Одним слоем на модуль это правило выразить нельзя —
    # разделение делает его проверяемым: доступ к слою `SpiralFramework` есть только у
    # `{Module}InfrastructureSpiral`. Слои взаимоисключающие: класс попадает ровно в один из них,
    # иначе deptrac проверял бы направление против каждого слоя цели.

    - name: AccessDomain
      collectors:
        - type: classLike
          value: '^App\\Modules\\Access\\Domain\\'

    - name: AccessPublic
      collectors:
        - type: classLike
          value: '^App\\Modules\\Access\\Public\\'

    - name: AccessApplication
      collectors:
        - type: classLike
          value: '^App\\Modules\\Access\\Application\\'

    - name: AccessInfrastructure
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^App\\Modules\\Access\\Infrastructure\\'
          must_not:
            - type: classLike
              value: '^App\\Modules\\Access\\Infrastructure\\Spiral\\'
        # Миграции Cycle живут в namespace `Migration\`, а не в `App\`, поэтому по имени класса их
        # не поймать — слой добирает их по каталогу модуля-владельца. Без этого миграция осталась
        # бы вне слоёв, и её зависимости никто бы не проверял.
        - type: directory
          value: 'app/src/Modules/Access/Infrastructure/Persistence/Cycle/Migration/'

    - name: AccessInfrastructureSpiral
      collectors:
        - type: classLike
          value: '^App\\Modules\\Access\\Infrastructure\\Spiral\\'

    - name: AuthDomain
      collectors:
        - type: classLike
          value: '^App\\Modules\\Auth\\Domain\\'

    - name: AuthPublic
      collectors:
