<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yoga Loka · Блоки статистики — 4 варианта</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #f6f4f9 0%, #eceaf0 100%);
    min-height: 100vh; font-family: 'Nunito Sans', system-ui, sans-serif; color: #241b30;
    -webkit-font-smoothing: antialiased; padding: 40px 28px 70px;
  }
  .head { text-align: center; max-width: 760px; margin: 0 auto 30px; }
  .head h1 { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 24px; margin: 0 0 6px; }
  .head p { margin: 0; color: #6b6478; font-size: 14.5px; line-height: 1.5; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(360px, 460px)); gap: 24px; justify-content: center; }

  .card {
    background: #fff; border-radius: 26px; padding: 22px 22px 26px;
    box-shadow: 0 18px 50px -28px rgba(30,20,50,0.45); border: 1px solid #f0eef2;
  }
  .card .tag { display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px; }
  .card .vno {
    font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 12px; color: #fff;
    background: #9B5DE5; width: 22px; height: 22px; border-radius: 7px;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; align-self: center;
  }
  .card h2 { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 16px; margin: 0; }
  .card .desc { color: #8b8398; font-size: 12.5px; margin: 2px 0 18px; line-height: 1.45; }

  /* mini profile context */
  .ctx { display: flex; align-items: center; gap: 14px; }
  .ava { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
  .ava .ring {
    width: 64px; height: 64px; border-radius: 50%; padding: 3.5px; box-sizing: border-box;
    background: conic-gradient(from 210deg, #FF6F61, #FFB020, #5DBB63, #22C2B0, #4D9DE0, #9B5DE5, #F15BB5, #FF6F61);
    display: flex; align-items: center; justify-content: center;
  }
  .ava .face {
    width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff;
    background: linear-gradient(150deg, #FFE3C4, #FFD0E0);
    display: flex; align-items: center; justify-content: center; font-size: 28px;
  }
  .row { flex: 1; display: flex; gap: 7; }

  /* ===== shared stat structures ===== */
  .num { font-family: 'Quicksand', sans-serif; font-weight: 700; line-height: 1; }

  /* A · Линии */
  .vA { display: flex; align-items: center; }
  .vA .cell { flex: 1; text-align: center; padding: 2px 4px; }
  .vA .num { font-size: 19px; color: #241b30; }
  .vA .lab { font-size: 11px; font-weight: 600; color: #a49bb0; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .vA .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .vA .sep { width: 1px; align-self: stretch; margin: 7px 0; background: #ece9ef; }

  /* B · Стекло */
  .vB { display: flex; gap: 8px; padding: 7px; border-radius: 20px;
        background: linear-gradient(120deg, rgba(255,111,97,0.10), rgba(155,93,229,0.10), rgba(34,194,176,0.10)); }
  .vB .cell { flex: 1; border-radius: 14px; padding: 9px 6px; text-align: center;
        background: rgba(255,255,255,0.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 4px 12px -8px rgba(30,20,50,0.4), inset 0 1px 0 rgba(255,255,255,0.9); }
  .vB .num { font-size: 18px; color: #241b30; }
  .vB .lab { font-size: 10.5px; font-weight: 600; margin-top: 3px; }

  /* C · Серый + цветная цифра */
  .vC { display: flex; gap: 8px; }
  .vC .cell { flex: 1; border-radius: 15px; padding: 9px 6px; text-align: center; background: #f3f2f6; }
  .vC .num { font-size: 18px; }
  .vC .lab { font-size: 10.5px; font-weight: 600; color: #8b8398; margin-top: 3px; }

  /* D · Тень-свечение */
  .vD { display: flex; gap: 9px; }
  .vD .cell { flex: 1; border-radius: 15px; padding: 9px 6px; text-align: center; background: #fff; }
  .vD .num { font-size: 18px; color: #241b30; }
  .vD .lab { font-size: 10.5px; font-weight: 600; margin-top: 3px; }
</style>
</head>
<body>
<div class="head">
  <h1>Блоки статистики · 4 варианта</h1>
  <p>Все компактнее и легче текущего, но с цветом. Каждый показан рядом с аватаром — как в профиле. Скажи номер (или смесь), и я применю.</p>
</div>

<div class="grid" id="grid"></div>

<script>
  const STATS = [
    { n: '248',   l: 'постов',       c: '#FF6F61' },
    { n: '12,4К', l: 'подписчиков',  c: '#9B5DE5' },
    { n: '56',    l: 'практик',      c: '#22C2B0' },
  ];
  const mix = (hex, p, base = '#ffffff') => {
    // simple hex mix p% of hex over base
    const h = x => [1,3,5].map(i => parseInt(x.slice(i, i+2), 16));
    const [r1,g1,b1] = h(hex), [r2,g2,b2] = h(base);
    const m = (a,b) => Math.round(a*p + b*(1-p));
    return `rgb(${m(r1,r2)}, ${m(g1,g2)}, ${m(b1,b2)})`;
  };

  const VARIANTS = [
    { no: 'A', name: 'Линии', desc: 'Без коробок: цифры с тонкими разделителями и точкой-акцентом. Самый лёгкий вариант.',
      build: () => {
        let h = '<div class="vA">';
        STATS.forEach((s, i) => {
          if (i) h += '<div class="sep"></div>';
          h += `<div class="cell"><div class="num">${s.n}</div><div class="lab"><span class="dot" style="background:${s.c}"></span>${s.l}</div></div>`;
        });
        return h + '</div>';
      } },
    { no: 'B', name: 'Стекло', desc: 'Матовые полупрозрачные ячейки с лёгким размытием и мягкой тенью. Цвет — еле уловимой подложкой.',
      build: () => '<div class="vB">' + STATS.map(s =>
        `<div class="cell"><div class="num">${s.n}</div><div class="lab" style="color:${mix(s.c,0.6)}">${s.l}</div></div>`).join('') + '</div>' },
    { no: 'C', name: 'Серый + цветная цифра', desc: 'Спокойная нейтральная подложка, но цифра — в цвете. Гасит «тухлость» серого, не перетягивая внимание.',
      build: () => '<div class="vC">' + STATS.map(s =>
        `<div class="cell"><div class="num" style="color:${s.c}">${s.n}</div><div class="lab">${s.l}</div></div>`).join('') + '</div>' },
    { no: 'D', name: 'Тень-свечение', desc: 'Белые ячейки без рамки с мягкой цветной тенью-свечением снизу. Цвет ощущается, но не заливкой.',
      build: () => '<div class="vD">' + STATS.map(s =>
        `<div class="cell" style="box-shadow:0 7px 18px -9px ${mix(s.c,0.7)}, 0 1px 3px rgba(30,20,50,0.05)"><div class="num">${s.n}</div><div class="lab" style="color:${mix(s.c,0.62)}">${s.l}</div></div>`).join('') + '</div>' },
  ];

  document.getElementById('grid').innerHTML = VARIANTS.map(v => `
    <div class="card">
      <div class="tag"><span class="vno">${v.no}</span><h2>${v.name}</h2></div>
      <div class="desc">${v.desc}</div>
      <div class="ctx">
        <div class="ava"><div class="ring"><div class="face">🧘‍♀️</div></div></div>
        <div class="row">${v.build()}</div>
      </div>
    </div>
  `).join('');
</script>
</body>
</html>

<style id="__om-edit-overrides">
#grid .row >.vC >div:nth-child(1) { background-color: rgb(255, 255, 255) !important }
#grid .row >.vC >div:nth-child(2) { background-color: rgb(255, 255, 255) !important }
#grid .row >.vC >div:nth-child(3) { background-color: rgb(255, 255, 255) !important }
</style>
