<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yoga Loka · 4 варианта акцента</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #eceaf0; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  /* ── colourful phone scope (.ylp) ─────────────────────────────── */
  .ylp {
    /* neutrals — light */
    --p-bg: #ffffff; --p-elev: #ffffff; --p-ctrl: #F2EFF7;
    --p-border: #f0eef2; --p-chrome: rgba(255,255,255,0.86); --p-statbg: rgba(20,16,40,0.025);
    --p-ink: #241b30; --p-soft: #3f384b; --p-mute: #6b6478; --p-faint: #a49bb0;
    /* control accent — overridden per variant */
    --ctrl-accent: #9B5DE5; --ctrl-accent-soft: #EDE4FB;
    /* pops — light */
    --c-coral: #FF6F61; --c-sun: #FFB020; --c-mint: #22C2B0;
    --c-sky: #4D9DE0; --c-grape: #9B5DE5; --c-bubble: #F15BB5; --c-leaf: #5DBB63;
    --c-goldink: #C77F0A;
    /* tints — light */
    --t-coral: #FFE7E3; --t-sun: #FFF0D2; --t-mint: #D4F3EF;
    --t-sky: #E2EEFA; --t-grape: #EDE4FB; --t-bubble: #FCE1EF; --t-leaf: #E1F3E3;

    height: 100%; position: relative;
    background-color: var(--p-bg); color: var(--p-ink);
    font-family: 'Nunito Sans', system-ui, sans-serif;
    font-size: 15px; line-height: 1.45; overflow: hidden; isolation: isolate;
  }
  .ylp.dark {
    --p-bg: #15121c; --p-elev: #211b2c; --p-ctrl: #2a2438;
    --p-border: #2c2639; --p-chrome: rgba(21,18,28,0.82); --p-statbg: rgba(255,255,255,0.045);
    --p-ink: #f3eef9; --p-soft: #d3ccdd; --p-mute: #a79fb4; --p-faint: #8c8499;
    --ctrl-accent: #B98BF0; --ctrl-accent-soft: rgba(155,93,229,0.24);
    --c-coral: #FF8A7E; --c-sun: #FFC04D; --c-mint: #3CD6C4;
    --c-sky: #6FB1EE; --c-grape: #B98BF0; --c-bubble: #FF7EC8; --c-leaf: #7BD080;
    --c-goldink: #FFC861;
    --t-coral: rgba(255,111,97,0.20); --t-sun: rgba(255,176,32,0.20); --t-mint: rgba(34,194,176,0.20);
    --t-sky: rgba(77,157,224,0.20); --t-grape: rgba(155,93,229,0.24); --t-bubble: rgba(241,91,181,0.20); --t-leaf: rgba(93,187,99,0.20);
  }
  .ylp .pscroll { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
  .ylp .picon { appearance: none; border: none; cursor: pointer; background: transparent; display: inline-flex; align-items: center; justify-content: center; padding: 0; width: 38px; height: 38px; border-radius: 12px; transition: transform .12s ease; }
  .ylp .tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="playful.jsx"></script>

<script type="text/babel">
  const VARIANTS = [
    { id: 'grape',  name: 'Фиолетовый',  hint: 'текущий',   accent: '#9B5DE5', soft: '#EDE4FB' },
    { id: 'coral',  name: 'Коралловый',  hint: 'тёплый',    accent: '#FF6F61', soft: '#FFE7E3' },
    { id: 'sky',    name: 'Голубой',     hint: 'спокойный', accent: '#4D9DE0', soft: '#E2EEFA' },
    { id: 'bubble', name: 'Розовый',     hint: 'яркий',     accent: '#F15BB5', soft: '#FCE1EF' },
    { id: 'mix',    name: 'Коралл + голубая «Сообщение»', hint: 'микс', accent: '#FF6F61', soft: '#FFE7E3', msg: '#4D9DE0' },
  ];

  function HeaderCard({ accent, soft, msg }) {
    const vars = { height: '100%', '--ctrl-accent': accent, '--ctrl-accent-soft': soft };
    if (msg) vars['--msg-accent'] = msg;
    return (
      <div className="ylp" style={vars}>
        <PTopBar />
        <div className="pscroll">
          <PHeader />
        </div>
      </div>
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="accent" title="Основной акцент — 5 вариантов" subtitle="Светлая тема · шапка профиля с аватаром">
          {VARIANTS.map((v) => (
            <DCArtboard key={v.id} id={v.id} label={`${v.name} · ${v.hint}`} width={384} height={596}>
              <IOSDevice width={384} height={596} dark={false}>
                <HeaderCard accent={v.accent} soft={v.soft} msg={v.msg} />
              </IOSDevice>
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
