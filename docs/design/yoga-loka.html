<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yoga Loka · Профиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #e7e1d6; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  /* ── tokens (light defaults; overwritten by Tweaks via :root) ──── */
  :root {
    --bg: #fcfbf7;
    --bg-2: #efebe2;          /* subtle surfaces / placeholders */
    --ink: #211d18;
    --ink-soft: #6e685d;
    --ink-faint: #a39c8e;
    --accent: oklch(0.55 0.12 42);
    --accent-soft: oklch(0.55 0.12 42 / 0.12);
    --on-accent: #fcfbf7;
    --hairline: rgba(40,33,22,0.12);
    --hairline-2: rgba(40,33,22,0.06);
    --glass-bg: rgba(252,251,247,0.74);
    --glass-bd: rgba(40,33,22,0.08);
    --glass-blur: 18px;
    --r-lg: 22px;
    --r-md: 14px;
    --r-sm: 10px;
    --sp: 1;
    --font-display: 'Sora', system-ui, sans-serif;
    --font-body: 'Manrope', system-ui, sans-serif;
    --fontScale: 1;
  }

  /* ── phone scope ──────────────────────────────────────────────── */
  .yl {
    height: 100%; position: relative;
    color: var(--ink); background: var(--bg);
    font-family: var(--font-body);
    font-size: calc(15px * var(--fontScale, 1));
    line-height: 1.45; overflow: hidden; isolation: isolate;
  }
  .yl .scroll {
    position: absolute; inset: 0; z-index: 1;
    overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  }
  .yl .scroll::-webkit-scrollbar { display: none; }

  /* ── glass (subtle, neutral — only for chrome) ─────────────────── */
  .glass {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(125%);
    backdrop-filter: blur(var(--glass-blur)) saturate(125%);
    border: 1px solid var(--glass-bd);
  }

  /* ── primitives ───────────────────────────────────────────────── */
  .display { font-family: var(--font-display); letter-spacing: -0.01em; }
  .soft { color: var(--ink-soft); }
  .faint { color: var(--ink-faint); }
  .hr { height: 1px; background: var(--hairline); border: 0; margin: 0; }

  .btn {
    appearance: none; cursor: pointer; font-family: var(--font-body);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-weight: 600; font-size: 14px; border: 1px solid transparent;
    transition: transform .12s ease, background .15s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-accent { background: var(--accent); color: var(--on-accent); box-shadow: 0 2px 8px -4px var(--accent), inset 0 1px 0 rgba(255,255,255,0.15); }
  .btn-ghost  { background: transparent; color: var(--ink); border-color: var(--hairline); }

  .icon-btn {
    appearance: none; border: none; background: none; cursor: pointer; color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
    transition: transform .12s ease, color .15s ease;
  }
  .icon-btn:active { transform: scale(0.88); }
  .tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--hairline); color: var(--ink-soft); white-space: nowrap;
  }

  /* neutral image placeholder */
  .ph {
    position: relative; overflow: hidden; background: var(--bg-2);
    background-image: repeating-linear-gradient(135deg, var(--hairline-2) 0 1px, transparent 1px 12px);
    display: flex; align-items: flex-end;
  }
  .ph .ph-tag {
    font-family: 'Space Grotesk', monospace; font-size: 10px; letter-spacing: 0.2px;
    color: var(--ink-faint); margin: 8px; padding: 2px 7px; border-radius: 6px;
    background: var(--bg);
  }

  @keyframes ylpop { from { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.15); } to { transform: scale(1); opacity: 1; } }
  @keyframes ylslide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .yl-enter { animation: ylslide .22s ease both; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="feed.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
