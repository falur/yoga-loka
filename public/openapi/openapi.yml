openapi: 3.1.0
info:
  title: 'YogaLoka API'
  version: 1.0.0
servers:
  -
    url: /api/v1
paths:
  /health:
    get:
      operationId: health
      description: 'Проверка работоспособности API'
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/HealthResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          nullable: true
      required:
        - message
    HealthResource:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
      required:
        - status
    HealthStatus:
      type: string
      enum:
        - ok
