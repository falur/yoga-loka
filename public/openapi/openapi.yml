openapi: 3.1.0
info:
  title: 'YogaLoka API'
  version: 1.0.0
servers:
  -
    url: /api/v1
paths:
  /auth/code/request:
    post:
      operationId: api_v1_auth_code_request
      description: 'Запрос кода входа на email. Ответ всегда 204 (наличие пользователя не раскрываем).'
      security: []
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RequestCodeFilter' } }
  /auth/code/verify:
    post:
      operationId: api_v1_auth_code_verify
      description: 'Проверка кода: пара токенов существующему пользователю или талон регистрации новому email.'
      security: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/VerifyResultResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/VerifyCodeFilter' } }
  /auth/register:
    post:
      operationId: api_v1_auth_register
      description: 'Завершение регистрации по талону: создаёт пользователя и выдаёт пару токенов.'
      security: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenPairResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RegisterFilter' } }
  /auth/refresh:
    post:
      operationId: api_v1_auth_refresh
      description: 'Обновление пары токенов по refresh-токену (ротация).'
      security: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenPairResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RefreshFilter' } }
  /auth/logout:
    post:
      operationId: api_v1_auth_logout
      description: 'Выход: отзыв всех токенов текущей сессии. Требует Bearer access-токен.'
      security:
        -
          bearerAuth: []
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/sessions:
    get:
      operationId: api_v1_auth_sessions_index
      description: 'Список своих активных сессий с устройством, IP и пометкой текущей. Требует Bearer access-токен.'
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionResourceCollectionResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/auth/sessions/{sessionId}':
    delete:
      operationId: api_v1_auth_sessions_revoke
      description: 'Отзыв своей сессии по её id; требует Bearer access-токен; чужая/несуществующая → 404.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notifications:
    get:
      operationId: api_v1_notifications_list
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: cursor
          in: query
          required: false
          schema: { type: [string, 'null'] }
        -
          name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationResourcePaginationResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notifications/unread-count:
    get:
      operationId: api_v1_notifications_unread_count
      description: ''
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/UnreadCountResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/notifications/{id}/read':
    post:
      operationId: api_v1_notifications_read
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notifications/read-all:
    post:
      operationId: api_v1_notifications_read_all
      description: ''
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/UnreadCountResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notification-device-tokens:
    post:
      operationId: api_v1_notification_device_tokens_register
      description: ''
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationDeviceTokenResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RegisterNotificationDeviceTokenFilter' } }
    delete:
      operationId: api_v1_notification_device_tokens_remove
      description: ''
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationDeviceTokenResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RemoveNotificationDeviceTokenFilter' } }
  /notification-settings:
    get:
      operationId: api_v1_notification_settings_get
      description: ''
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettingResourceCollectionResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    put:
      operationId: api_v1_notification_settings_update
      description: ''
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettingResourceCollectionResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/{id}/comments':
    post:
      operationId: api_v1_posts_comments_create
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CommentResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CommentPostFilter' } }
    get:
      operationId: api_v1_posts_comments_list
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
        -
          name: cursor
          in: query
          required: false
          schema: { type: [string, 'null'] }
        -
          name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CommentResourcePaginationResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/comments/{id}/replies':
    post:
      operationId: api_v1_posts_comments_reply
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CommentResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReplyCommentFilter' } }
    get:
      operationId: api_v1_posts_comments_replies
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
        -
          name: cursor
          in: query
          required: false
          schema: { type: [string, 'null'] }
        -
          name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CommentResourcePaginationResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/comments/{id}':
    delete:
      operationId: api_v1_posts_comments_delete
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/comments/{id}/like':
    post:
      operationId: api_v1_posts_comments_like
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    delete:
      operationId: api_v1_posts_comments_unlike
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /posts:
    post:
      operationId: api_v1_posts_create
      description: ''
      security:
        -
          bearerAuth: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/PostResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreatePostFilter' } }
  '/posts/{id}/publish':
    post:
      operationId: api_v1_posts_publish
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/PostResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/{id}/repost':
    post:
      operationId: api_v1_posts_repost
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/PostResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RepostPostFilter' } }
  '/posts/{id}':
    delete:
      operationId: api_v1_posts_delete
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    get:
      operationId: api_v1_posts_show
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/PostResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/{id}/like':
    post:
      operationId: api_v1_posts_like
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    delete:
      operationId: api_v1_posts_unlike
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/user/{id}':
    get:
      operationId: api_v1_posts_user_feed
      description: ''
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
        -
          name: cursor
          in: query
          required: false
          schema: { type: [string, 'null'] }
        -
          name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/PostResourcePaginationResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /health:
    get:
      operationId: health
      description: 'Проверка работоспособности API'
      security: []
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { $ref: '#/components/schemas/HealthResourceDataResponse' } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
components:
  schemas:
    AttachmentType:
      type: string
      enum:
        - none
        - media
        - lesson
        - practice
    AuthorResource:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        avatar:
          oneOf: [{ $ref: '#/components/schemas/MediaResource' }, { type: 'null' }]
      required:
        - userId
        - name
    CommentPostFilter:
      type: object
      properties:
        text:
          type: string
        mentions:
          type: array
          items: { type: string }
      required:
        - text
    CommentResource:
      type: object
      properties:
        id:
          type: string
        postId:
          type: string
        parentId:
          type: [string, 'null']
        text:
          type: string
        likesCount:
          type: integer
        repliesCount:
          type: integer
        likedByMe:
          type: boolean
        createdAt:
          type: string
          format: date-time
        author:
          $ref: '#/components/schemas/AuthorResource'
      required:
        - id
        - postId
        - text
        - likesCount
        - repliesCount
        - likedByMe
        - createdAt
        - author
    CommentResourceDataResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CommentResource'
      required:
        - data
    CommentResourcePaginationResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CommentResource' }
        meta:
          type: object
          properties: { nextCursor: { type: [string, 'null'] }, limit: { type: integer } }
          required: [nextCursor, limit]
      required:
        - data
        - meta
    CreatePostFilter:
      type: object
      properties:
        text:
          type: [string, 'null']
        draft:
          type: boolean
          default: false
        mediaIds:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        mentions:
          type: array
          items: { type: string }
    DevicePlatform:
      type: string
      enum:
        - ios
        - android
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: [integer, 'null']
      required:
        - message
    HealthResource:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
      required:
        - status
    HealthResourceDataResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/HealthResource'
      required:
        - data
    HealthStatus:
      type: string
      enum:
        - ok
    MediaAudioConversionType:
      type: string
      enum:
        - normalizedAacM4a
    MediaConversionKind:
      type: string
      enum:
        - image
        - video
        - audio
    MediaConversionResource:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/MediaConversionKind'
        type:
          oneOf: [{ $ref: '#/components/schemas/MediaImageConversionType' }, { $ref: '#/components/schemas/MediaVideoConversionType' }, { $ref: '#/components/schemas/MediaAudioConversionType' }]
        url:
          type: string
        expiresAt:
          type: [string, 'null']
          format: date-time
      required:
        - kind
        - type
        - url
    MediaImageConversionType:
      type: string
      enum:
        - thumbnail
        - preview
        - large
        - poster
    MediaOriginalResource:
      type: object
      properties:
        url:
          type: string
        expiresAt:
          type: [string, 'null']
          format: date-time
      required:
        - url
    MediaResource:
      type: object
      properties:
        id:
          type: string
        position:
          type: [integer, 'null']
        original:
          oneOf: [{ $ref: '#/components/schemas/MediaOriginalResource' }, { type: 'null' }]
        conversions:
          type: array
          items: { $ref: '#/components/schemas/MediaConversionResource' }
      required:
        - id
        - conversions
    MediaVideoConversionType:
      type: string
      enum:
        - normalizedMp4H264
    NotificationActionResource:
      type: object
      properties:
        actionType:
          type: string
        actionId:
          type: string
      required:
        - actionType
        - actionId
    NotificationActorResource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatar:
          oneOf: [{ $ref: '#/components/schemas/MediaResource' }, { type: 'null' }]
      required:
        - id
        - name
    NotificationChannel:
      type: string
      enum:
        - database
        - push
        - realtime
    NotificationDeviceTokenResource:
      type: object
      properties:
        id:
          type: string
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - platform
        - createdAt
    NotificationDeviceTokenResourceDataResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/NotificationDeviceTokenResource'
      required:
        - data
    NotificationResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        action:
          oneOf: [{ $ref: '#/components/schemas/NotificationActionResource' }, { type: 'null' }]
        actor:
          oneOf: [{ $ref: '#/components/schemas/NotificationActorResource' }, { type: 'null' }]
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - body
        - read
        - createdAt
    NotificationResourceDataResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/NotificationResource'
      required:
        - data
    NotificationResourcePaginationResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NotificationResource' }
        meta:
          type: object
          properties: { nextCursor: { type: [string, 'null'] }, limit: { type: integer } }
          required: [nextCursor, limit]
      required:
        - data
        - meta
    NotificationSettingResource:
      type: object
      properties:
        type:
          type: string
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        enabled:
          type: boolean
