openapi: 3.1.0
info:
  title: 'YogaLoka API'
  version: 1.0.0
servers:
  -
    url: /api/v1
paths:
  /auth/code/request:
    post:
      operationId: api_v1_auth_code_request
      description: 'Запрос кода входа на email. Ответ всегда 204 (наличие пользователя не раскрываем).'
      parameters: {  }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { email: { type: string } }, required: [email] } }
  /auth/code/verify:
    post:
      operationId: api_v1_auth_code_verify
      description: 'Проверка кода: пара токенов существующему пользователю или талон регистрации новому email.'
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/VerifyResultResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { email: { type: string }, code: { type: string } }, required: [email, code] } }
  /auth/register:
    post:
      operationId: api_v1_auth_register
      description: 'Завершение регистрации по талону: создаёт пользователя и выдаёт пару токенов.'
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/TokenPairResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { ticket: { type: string }, name: { type: string }, nickname: { type: string } }, required: [ticket, name, nickname] } }
  /auth/refresh:
    post:
      operationId: api_v1_auth_refresh
      description: 'Обновление пары токенов по refresh-токену (ротация).'
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/TokenPairResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { refreshToken: { type: string } }, required: [refreshToken] } }
  /auth/logout:
    post:
      operationId: api_v1_auth_logout
      description: 'Выход: отзыв всех токенов текущей сессии. Требует Bearer access-токен.'
      parameters: {  }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/sessions:
    get:
      operationId: api_v1_auth_sessions_index
      description: 'Список своих активных сессий с устройством, IP и пометкой текущей. Требует Bearer access-токен.'
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/SessionResource' } } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/auth/sessions/{sessionId}':
    delete:
      operationId: api_v1_auth_sessions_revoke
      description: 'Отзыв своей сессии по её id; требует Bearer access-токен; чужая/несуществующая → 404.'
      parameters:
        -
          name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notifications:
    get:
      operationId: api_v1_notifications_list
      description: ''
      parameters:
        -
          name: cursor
          in: query
          required: false
          schema: { type: [string, 'null'] }
        -
          name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationResource' } }, meta: { type: object, properties: { nextCursor: { type: [string, 'null'] }, limit: { type: integer } }, required: [nextCursor, limit] } }, required: [data, meta] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notifications/unread-count:
    get:
      operationId: api_v1_notifications_unread_count
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/UnreadCountResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/notifications/{id}/read':
    post:
      operationId: api_v1_notifications_read
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/NotificationResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notifications/read-all:
    post:
      operationId: api_v1_notifications_read_all
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/UnreadCountResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notification-device-tokens:
    post:
      operationId: api_v1_notification_device_tokens_register
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/NotificationDeviceTokenResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { token: { type: string }, platform: { type: string } }, required: [token, platform] } }
    delete:
      operationId: api_v1_notification_device_tokens_remove
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/NotificationDeviceTokenResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { token: { type: string } }, required: [token] } }
  /notification-settings:
    get:
      operationId: api_v1_notification_settings_get
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationSettingResource' } } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    put:
      operationId: api_v1_notification_settings_update
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationSettingResource' } } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/{id}/comments':
    post:
      operationId: api_v1_posts_comments_create
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommentResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { text: { type: string }, mentions: { type: array, items: { type: string } } }, required: [text] } }
    get:
      operationId: api_v1_posts_comments_list
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
        -
          name: cursor
          in: query
          required: false
          schema: { type: [string, 'null'] }
        -
          name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CommentResource' } }, meta: { type: object, properties: { nextCursor: { type: [string, 'null'] }, limit: { type: integer } }, required: [nextCursor, limit] } }, required: [data, meta] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/comments/{id}/replies':
    post:
      operationId: api_v1_posts_comments_reply
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommentResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { text: { type: string }, mentions: { type: array, items: { type: string } } }, required: [text] } }
    get:
      operationId: api_v1_posts_comments_replies
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
        -
          name: cursor
          in: query
          required: false
          schema: { type: [string, 'null'] }
        -
          name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CommentResource' } }, meta: { type: object, properties: { nextCursor: { type: [string, 'null'] }, limit: { type: integer } }, required: [nextCursor, limit] } }, required: [data, meta] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/comments/{id}':
    delete:
      operationId: api_v1_posts_comments_delete
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/comments/{id}/like':
    post:
      operationId: api_v1_posts_comments_like
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    delete:
      operationId: api_v1_posts_comments_unlike
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /posts:
    post:
      operationId: api_v1_posts_create
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/PostResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { text: { type: [string, 'null'] }, draft: { type: boolean }, mediaIds: { type: array, items: { type: string } }, tags: { type: array, items: { type: string } }, mentions: { type: array, items: { type: string } } } } }
  '/posts/{id}/publish':
    post:
      operationId: api_v1_posts_publish
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/PostResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/{id}/repost':
    post:
      operationId: api_v1_posts_repost
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/PostResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { text: { type: [string, 'null'] }, mediaIds: { type: array, items: { type: string } }, tags: { type: array, items: { type: string } }, mentions: { type: array, items: { type: string } } } } }
  '/posts/{id}':
    delete:
      operationId: api_v1_posts_delete
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    get:
      operationId: api_v1_posts_show
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/PostResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/{id}/like':
    post:
      operationId: api_v1_posts_like
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    delete:
      operationId: api_v1_posts_unlike
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'Успешный ответ.'
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  '/posts/user/{id}':
    get:
      operationId: api_v1_posts_user_feed
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
        -
          name: cursor
          in: query
          required: false
          schema: { type: [string, 'null'] }
        -
          name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PostResource' } }, meta: { type: object, properties: { nextCursor: { type: [string, 'null'] }, limit: { type: integer } }, required: [nextCursor, limit] } }, required: [data, meta] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /health:
    get:
      operationId: health
      description: 'Проверка работоспособности API'
      parameters: {  }
      responses:
        200:
          description: 'Успешный ответ.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/HealthResource' } }, required: [data] } } }
        default:
          description: 'Ошибка API.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
components:
  schemas:
    AuthorResource:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
      required:
        - userId
        - name
        - avatarUrl
    CommentResource:
      type: object
      properties:
        id:
          type: string
        postId:
          type: string
        parentId:
          type: [string, 'null']
        text:
          type: string
        likesCount:
          type: integer
        repliesCount:
          type: integer
        likedByMe:
          type: boolean
        createdAt:
          type: string
        author:
          $ref: '#/components/schemas/AuthorResource'
      required:
        - id
        - postId
        - text
        - likesCount
        - repliesCount
        - likedByMe
        - createdAt
        - author
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: [integer, 'null']
      required:
        - message
    HealthResource:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
      required:
        - status
    HealthStatus:
      type: string
      enum:
        - ok
    NotificationActionResource:
      type: object
      properties:
        actionType:
          type: string
        actionId:
          type: string
      required:
        - actionType
        - actionId
    NotificationActorResource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
      required:
        - id
        - name
        - avatarUrl
    NotificationDeviceTokenResource:
      type: object
      properties:
        id:
          type: string
        platform:
          type: string
        createdAt:
          type: string
      required:
        - id
        - platform
        - createdAt
    NotificationResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        action:
          oneOf: [{ $ref: '#/components/schemas/NotificationActionResource' }, { type: 'null' }]
        actor:
          oneOf: [{ $ref: '#/components/schemas/NotificationActorResource' }, { type: 'null' }]
        read:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - type
        - title
        - body
        - read
        - createdAt
    NotificationSettingResource:
      type: object
      properties:
        type:
          type: string
        channel:
          type: string
        enabled:
          type: boolean
        default:
          type: boolean
      required:
        - type
        - channel
        - enabled
        - default
    PostMediaItemResource:
      type: object
      properties:
        mediaId:
          type: string
        url:
          type: string
        position:
          type: integer
      required:
        - mediaId
        - url
        - position
    PostResource:
      type: object
      properties:
        id:
          type: string
        text:
          type: [string, 'null']
        status:
          type: string
        attachmentType:
          type: string
        likesCount:
          type: integer
        repostsCount:
          type: integer
        commentsCount:
          type: integer
        likedByMe:
          type: boolean
        createdAt:
          type: string
        author:
          $ref: '#/components/schemas/AuthorResource'
        media:
          type: array
          items: { $ref: '#/components/schemas/PostMediaItemResource' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagResource' }
        original:
          oneOf: [{ $ref: '#/components/schemas/PostResource' }, { type: 'null' }]
      required:
        - id
        - status
        - attachmentType
        - likesCount
        - repostsCount
        - commentsCount
        - likedByMe
        - createdAt
        - author
        - media
        - tags
    SessionResource:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
        expiresAt:
          type: string
        ip:
          type: [string, 'null']
        device:
          type: [string, 'null']
        current:
          type: boolean
      required:
        - id
        - createdAt
        - expiresAt
        - current
    TagResource:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
      required:
        - id
        - text
    TokenPairResource:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    UnreadCountResource:
      type: object
      properties:
        count:
          type: integer
      required:
        - count
    VerifyResultResource:
      type: object
      properties:
        needsProfile:
          type: boolean
        tokens:
          oneOf: [{ $ref: '#/components/schemas/TokenPairResource' }, { type: 'null' }]
        registrationTicket:
          type: [string, 'null']
      required:
        - needsProfile
