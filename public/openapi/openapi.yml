openapi: 3.1.0
info:
  title: 'YogaLoka API'
  version: 1.0.0
servers:
  -
    url: /api/v1
paths:
  /notifications:
    get:
      operationId: api_v1_notifications_list
      description: ''
      parameters:
        -
          name: cursor
          in: query
          required: false
          schema: { type: string }
        -
          name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        200:
          description: 'Successful response.'
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationResource' } }, meta: { type: object, properties: { nextCursor: { type: string, nullable: true }, limit: { type: integer } }, required: [nextCursor, limit] } }, required: [data, meta] } } }
        default:
          description: 'API error.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notifications/unread-count:
    get:
      operationId: api_v1_notifications_unread_count
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Successful response.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/UnreadCountResource' } }, required: [data] } } }
        default:
          description: 'API error.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notifications/<id>/read:
    post:
      operationId: api_v1_notifications_read
      description: ''
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: 'Successful response.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/NotificationResource' } }, required: [data] } } }
        default:
          description: 'API error.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notifications/read-all:
    post:
      operationId: api_v1_notifications_read_all
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Successful response.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/UnreadCountResource' } }, required: [data] } } }
        default:
          description: 'API error.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /notification-device-tokens:
    post:
      operationId: api_v1_notification_device_tokens_register
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Successful response.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/NotificationDeviceTokenResource' } }, required: [data] } } }
        default:
          description: 'API error.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { token: { type: string }, platform: { type: string } }, required: [token, platform] } }
    delete:
      operationId: api_v1_notification_device_tokens_remove
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Successful response.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/NotificationDeviceTokenResource' } }, required: [data] } } }
        default:
          description: 'API error.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { token: { type: string } }, required: [token] } }
  /notification-settings:
    get:
      operationId: api_v1_notification_settings_get
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Successful response.'
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationSettingResource' } } }, required: [data] } } }
        default:
          description: 'API error.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    put:
      operationId: api_v1_notification_settings_update
      description: ''
      parameters: {  }
      responses:
        200:
          description: 'Successful response.'
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationSettingResource' } } }, required: [data] } } }
        default:
          description: 'API error.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /health:
    get:
      operationId: health
      description: 'Проверка работоспособности API'
      parameters: {  }
      responses:
        200:
          description: 'Successful response.'
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/HealthResource' } }, required: [data] } } }
        default:
          description: 'API error.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          nullable: true
      required:
        - message
    HealthResource:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
      required:
        - status
    HealthStatus:
      type: string
      enum:
        - ok
    NotificationActionResource:
      type: object
      properties:
        actionType:
          type: string
        actionId:
          type: string
      required:
        - actionType
        - actionId
    NotificationActorResource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
      required:
        - id
        - name
        - avatarUrl
    NotificationDeviceTokenResource:
      type: object
      properties:
        id:
          type: string
        platform:
          type: string
        createdAt:
          type: string
      required:
        - id
        - platform
        - createdAt
    NotificationResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        action:
          $ref: '#/components/schemas/NotificationActionResource'
        actor:
          $ref: '#/components/schemas/NotificationActorResource'
        read:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - type
        - title
        - body
        - action
        - actor
        - read
        - createdAt
    NotificationSettingResource:
      type: object
      properties:
        type:
          type: string
        channel:
          type: string
        enabled:
          type: boolean
        default:
          type: boolean
      required:
        - type
        - channel
        - enabled
        - default
    UnreadCountResource:
      type: object
      properties:
        count:
          type: integer
      required:
        - count
